# ================================================
# SecureApprove - Docker Compose with Traefik
# ================================================

services:
  # PostgreSQL Database
  db:
    image: postgres:15
    container_name: secureapprove_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: secureapprove
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: secureapprove_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # Django Web Application
  web:
    build: 
      context: ./secureapprove_django
      dockerfile: Dockerfile
    container_name: secureapprove_web
    restart: unless-stopped
    expose:
      - "8005"
    ports:
      - "${LOCAL_PORT:-127.0.0.1:8005}:8005"
    environment:
      # Database
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: secureapprove
      DB_USER: postgres
      DB_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      
      # Redis
      REDIS_URL: redis://redis:6379/1
      
      # Django
      DEBUG: "False"
      SECRET_KEY: "${SECRET_KEY:?SECRET_KEY is required}"
      ALLOWED_HOSTS: "localhost,127.0.0.1,secureapprove.com,www.secureapprove.com,api.secureapprove.com"
      
      # Security
      WEBAUTHN_RP_NAME: "SecureApprove"
      WEBAUTHN_RP_ID: "secureapprove.com"
      WEBAUTHN_ORIGIN: "https://secureapprove.com"
      SECUREAPPROVE_PROOF_ENABLED: "${SECUREAPPROVE_PROOF_ENABLED:-False}"
      SECUREAPPROVE_PROOF_MARKETING_ENABLED: "${SECUREAPPROVE_PROOF_MARKETING_ENABLED:-False}"
      SECUREAPPROVE_PROOF_SIGNER: "${SECUREAPPROVE_PROOF_SIGNER:-aws_kms}"
      SECUREAPPROVE_PROOF_ENCRYPTION_BACKEND: "${SECUREAPPROVE_PROOF_ENCRYPTION_BACKEND:-aws_kms}"
      SECUREAPPROVE_PROOF_SIGNING_KEY_ARN: "${SECUREAPPROVE_PROOF_SIGNING_KEY_ARN:-}"
      SECUREAPPROVE_PROOF_SIGNING_KID: "${SECUREAPPROVE_PROOF_SIGNING_KID:-}"
      SECUREAPPROVE_PROOF_ENCRYPTION_KEY_ARN: "${SECUREAPPROVE_PROOF_ENCRYPTION_KEY_ARN:-}"
      SECUREAPPROVE_PROOF_ARCHIVE_ENABLED: "${SECUREAPPROVE_PROOF_ARCHIVE_ENABLED:-False}"
      SECUREAPPROVE_PROOF_ARCHIVE_BUCKET: "${SECUREAPPROVE_PROOF_ARCHIVE_BUCKET:-}"
      SECUREAPPROVE_PROOF_ARCHIVE_RETENTION_DAYS: "${SECUREAPPROVE_PROOF_ARCHIVE_RETENTION_DAYS:-3650}"
      AWS_REGION: "${AWS_REGION:-us-east-1}"
      
      # Email (configure for production)
      EMAIL_HOST: "smtp.gmail.com"
      EMAIL_PORT: "587"
      EMAIL_USE_TLS: "True"
      EMAIL_HOST_USER: "${EMAIL_HOST_USER:-}"
      EMAIL_HOST_PASSWORD: "${EMAIL_HOST_PASSWORD:-}"
      DEFAULT_FROM_EMAIL: "noreply@secureapprove.com"
      
      # Billing (configure for production)
      MERCADOPAGO_ACCESS_TOKEN: "${MERCADOPAGO_ACCESS_TOKEN:-}"
      MERCADOPAGO_WEBHOOK_URL: "https://api.secureapprove.com/api/billing/webhooks/mercadopago/"

      # Optional one-time bootstrap. Leave unset in normal production operation.
      SECUREAPPROVE_BOOTSTRAP_ADMIN_EMAIL: "${SECUREAPPROVE_BOOTSTRAP_ADMIN_EMAIL:-}"
      SECUREAPPROVE_BOOTSTRAP_ADMIN_PASSWORD: "${SECUREAPPROVE_BOOTSTRAP_ADMIN_PASSWORD:-}"
      SECUREAPPROVE_BOOTSTRAP_PRIMARY_EMAIL: "${SECUREAPPROVE_BOOTSTRAP_PRIMARY_EMAIL:-}"
    
    volumes:
      - ./secureapprove_django/media:/app/media
      - ./logs:/app/logs
    networks:
      - internal
      - secureapprove_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.secureapprove-web.rule=Host(`secureapprove.com`) || Host(`www.secureapprove.com`)"
      - "traefik.http.routers.secureapprove-web.entrypoints=websecure"
      - "traefik.http.routers.secureapprove-web.tls=true"
      - "traefik.http.services.secureapprove-web.loadbalancer.server.port=8005"
      - "traefik.docker.network=secureapprove_proxy"

  # Celery Worker
  celery:
    build: 
      context: ./secureapprove_django
      dockerfile: Dockerfile
    container_name: secureapprove_celery
    command: celery -A config worker -l info
    restart: unless-stopped
    environment:
      # Database
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: secureapprove
      DB_USER: postgres
      DB_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      
      # Redis
      REDIS_URL: redis://redis:6379/1
      
      # Django
      DEBUG: "False"
      SECRET_KEY: "${SECRET_KEY:?SECRET_KEY is required}"
      ALLOWED_HOSTS: "localhost,127.0.0.1,secureapprove.com,www.secureapprove.com,api.secureapprove.com"
      
      # Security
      WEBAUTHN_RP_NAME: "SecureApprove"
      WEBAUTHN_RP_ID: "secureapprove.com"
      WEBAUTHN_ORIGIN: "https://secureapprove.com"
      SECUREAPPROVE_PROOF_ENABLED: "${SECUREAPPROVE_PROOF_ENABLED:-False}"
      SECUREAPPROVE_PROOF_MARKETING_ENABLED: "${SECUREAPPROVE_PROOF_MARKETING_ENABLED:-False}"
      SECUREAPPROVE_PROOF_SIGNER: "${SECUREAPPROVE_PROOF_SIGNER:-aws_kms}"
      SECUREAPPROVE_PROOF_ENCRYPTION_BACKEND: "${SECUREAPPROVE_PROOF_ENCRYPTION_BACKEND:-aws_kms}"
      SECUREAPPROVE_PROOF_SIGNING_KEY_ARN: "${SECUREAPPROVE_PROOF_SIGNING_KEY_ARN:-}"
      SECUREAPPROVE_PROOF_SIGNING_KID: "${SECUREAPPROVE_PROOF_SIGNING_KID:-}"
      SECUREAPPROVE_PROOF_ENCRYPTION_KEY_ARN: "${SECUREAPPROVE_PROOF_ENCRYPTION_KEY_ARN:-}"
      SECUREAPPROVE_PROOF_ARCHIVE_ENABLED: "${SECUREAPPROVE_PROOF_ARCHIVE_ENABLED:-False}"
      SECUREAPPROVE_PROOF_ARCHIVE_BUCKET: "${SECUREAPPROVE_PROOF_ARCHIVE_BUCKET:-}"
      SECUREAPPROVE_PROOF_ARCHIVE_RETENTION_DAYS: "${SECUREAPPROVE_PROOF_ARCHIVE_RETENTION_DAYS:-3650}"
      AWS_REGION: "${AWS_REGION:-us-east-1}"
      
      # Email
      EMAIL_HOST: "smtp.gmail.com"
      EMAIL_PORT: "587"
      EMAIL_USE_TLS: "True"
      EMAIL_HOST_USER: "${EMAIL_HOST_USER:-}"
      EMAIL_HOST_PASSWORD: "${EMAIL_HOST_PASSWORD:-}"
      DEFAULT_FROM_EMAIL: "noreply@secureapprove.com"
      
      # Billing
      MERCADOPAGO_ACCESS_TOKEN: "${MERCADOPAGO_ACCESS_TOKEN:-}"
      MERCADOPAGO_WEBHOOK_URL: "https://api.secureapprove.com/api/billing/webhooks/mercadopago/"
    
    volumes:
      - ./secureapprove_django/media:/app/media
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - internal

  celery_beat:
    extends:
      service: celery
    container_name: secureapprove_celery_beat
    command: celery -A config beat -l info --schedule=/tmp/celerybeat-schedule
    healthcheck:
      disable: true

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  # Red interna para comunicación entre servicios
  internal:
    name: secureapprove_internal
    driver: bridge
  
  # Red externa de Traefik (debe existir previamente)
  secureapprove_proxy:
    external: true
