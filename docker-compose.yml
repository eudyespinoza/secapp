# ================================================
# SecureApprove - Docker Compose with Traefik
# ================================================

services:
  # PostgreSQL Database
  db:
    image: postgres:15
    container_name: secureapprove_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: secureapprove
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: secureapprove_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  vault_storage_init:
    image: hashicorp/vault:1.21.4
    container_name: secureapprove_vault_storage_init
    restart: "no"
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        chown -R 100:1000 /vault-data
        cp /source-tls/ca.crt /vault-tls/ca.crt
        cp /source-tls/server.crt /vault-tls/server.crt
        cp /source-tls/server.key /vault-tls/server.key
        chown 100:1000 /vault-tls/ca.crt /vault-tls/server.crt /vault-tls/server.key
        chmod 0444 /vault-tls/ca.crt /vault-tls/server.crt
        chmod 0400 /vault-tls/server.key
    volumes:
      - vault_data:/vault-data
      - vault_tls:/vault-tls
      - ${SECUREAPPROVE_SECRETS_DIR:-./secrets}/vault/tls:/source-tls:ro
    security_opt:
      - no-new-privileges:true
    network_mode: none

  # Private key custody and envelope encryption. Vault is not exposed to the
  # host or directly to Django; the dedicated proxy injects a renewable AppRole
  # token and enforces the least-privilege application identity.
  vault:
    image: hashicorp/vault:1.21.4
    container_name: secureapprove_vault
    restart: unless-stopped
    command: vault server -config=/vault/config/vault.hcl
    cap_add:
      - IPC_LOCK
    ulimits:
      memlock:
        soft: -1
        hard: -1
    environment:
      VAULT_ADDR: https://127.0.0.1:8200
      VAULT_CACERT: /vault/tls/ca.crt
    volumes:
      - vault_data:/vault/data
      - ./infra/vault/vault.hcl:/vault/config/vault.hcl:ro
      - vault_tls:/vault/tls:ro
    depends_on:
      vault_storage_init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "vault status >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    networks:
      - proof_vault_backend

  vault_proxy_secrets_init:
    image: hashicorp/vault:1.21.4
    container_name: secureapprove_vault_proxy_secrets_init
    restart: "no"
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        cp /source-auth/role-id /vault-auth/role-id
        cp /source-auth/secret-id /vault-auth/secret-id
        chown 100:1000 /vault-auth/role-id /vault-auth/secret-id
        chmod 0400 /vault-auth/role-id /vault-auth/secret-id
    volumes:
      - ${SECUREAPPROVE_SECRETS_DIR:-./secrets}/vault:/source-auth:ro
      - vault_auth:/vault-auth
    security_opt:
      - no-new-privileges:true
    network_mode: none

  vault_proxy:
    image: hashicorp/vault:1.21.4
    container_name: secureapprove_vault_proxy
    restart: unless-stopped
    command: vault proxy -config=/vault/config/proxy.hcl
    cap_add:
      - IPC_LOCK
    ulimits:
      memlock:
        soft: -1
        hard: -1
    environment:
      VAULT_CACERT: /vault/tls/ca.crt
    volumes:
      - ./infra/vault/proxy.hcl:/vault/config/proxy.hcl:ro
      - vault_tls:/vault/tls:ro
      - vault_auth:/vault/auth:ro
    depends_on:
      vault:
        condition: service_healthy
      vault_proxy_secrets_init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "VAULT_ADDR=http://127.0.0.1:8100 vault status >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    networks:
      - proof_vault_backend
      - proof_vault_client

  minio_secrets_init:
    image: hashicorp/vault:1.21.4
    container_name: secureapprove_minio_secrets_init
    restart: "no"
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        cp /source-minio/minio.env /minio-root/minio.env
        cp /source-minio/archive-credentials /proof-app/archive-credentials
        chown 1000:1000 /minio-root/minio.env /proof-app/archive-credentials
        chmod 0400 /minio-root/minio.env /proof-app/archive-credentials
    volumes:
      - ${SECUREAPPROVE_SECRETS_DIR:-./secrets}/minio:/source-minio:ro
      - minio_root_secrets:/minio-root
      - proof_app_secrets:/proof-app
    security_opt:
      - no-new-privileges:true
    network_mode: none

  # Public JWS receipts are stored in a versioned Object Lock bucket. Only the
  # application archive identity can write under proofs/; root credentials stay
  # in a host-owned config file and are never mounted into Django.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: secureapprove_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_CONFIG_ENV_FILE: /run/secrets/minio.env
    volumes:
      - minio_data:/data
      - minio_root_secrets:/run/secrets:ro
    depends_on:
      minio_secrets_init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    networks:
      - proof_archive

  minio_init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: secureapprove_minio_init
    restart: "no"
    entrypoint: ["/bin/sh", "/bootstrap/minio-bootstrap.sh"]
    environment:
      PROOF_ARCHIVE_BUCKET: "${SECUREAPPROVE_PROOF_ARCHIVE_BUCKET:-secureapprove-proofs}"
      PROOF_ARCHIVE_RETENTION_DAYS: "${SECUREAPPROVE_PROOF_ARCHIVE_RETENTION_DAYS:-3650}"
    volumes:
      - ./infra/minio/minio-bootstrap.sh:/bootstrap/minio-bootstrap.sh:ro
      - minio_root_secrets:/run/minio-secrets:ro
      - proof_app_secrets:/run/app-secrets:ro
    depends_on:
      minio:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    networks:
      - proof_archive

  # Django Web Application
  web:
    build: 
      context: ./secureapprove_django
      dockerfile: Dockerfile
    container_name: secureapprove_web
    restart: unless-stopped
    expose:
      - "8005"
    ports:
      - "${LOCAL_PORT:-127.0.0.1:8005}:8005"
    environment:
      # Database
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: secureapprove
      DB_USER: postgres
      DB_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      
      # Redis
      REDIS_URL: redis://redis:6379/1
      
      # Django
      DEBUG: "False"
      SECRET_KEY: "${SECRET_KEY:?SECRET_KEY is required}"
      ALLOWED_HOSTS: "localhost,127.0.0.1,secureapprove.com,www.secureapprove.com,api.secureapprove.com"
      
      # Security
      WEBAUTHN_RP_NAME: "SecureApprove"
      WEBAUTHN_RP_ID: "secureapprove.com"
      WEBAUTHN_ORIGIN: "https://secureapprove.com"
      SECUREAPPROVE_PROOF_ENABLED: "${SECUREAPPROVE_PROOF_ENABLED:-False}"
      SECUREAPPROVE_PROOF_MARKETING_ENABLED: "${SECUREAPPROVE_PROOF_MARKETING_ENABLED:-False}"
      SECUREAPPROVE_PROOF_SIGNER: "${SECUREAPPROVE_PROOF_SIGNER:-aws_kms}"
      SECUREAPPROVE_PROOF_ENCRYPTION_BACKEND: "${SECUREAPPROVE_PROOF_ENCRYPTION_BACKEND:-aws_kms}"
      SECUREAPPROVE_PROOF_SIGNING_KEY_ARN: "${SECUREAPPROVE_PROOF_SIGNING_KEY_ARN:-}"
      SECUREAPPROVE_PROOF_SIGNING_KID: "${SECUREAPPROVE_PROOF_SIGNING_KID:-}"
      SECUREAPPROVE_PROOF_ENCRYPTION_KEY_ARN: "${SECUREAPPROVE_PROOF_ENCRYPTION_KEY_ARN:-}"
      SECUREAPPROVE_VAULT_ADDR: "${SECUREAPPROVE_VAULT_ADDR:-http://vault_proxy:8100}"
      SECUREAPPROVE_VAULT_TIMEOUT_SECONDS: "${SECUREAPPROVE_VAULT_TIMEOUT_SECONDS:-5}"
      SECUREAPPROVE_VAULT_TRANSIT_MOUNT: "${SECUREAPPROVE_VAULT_TRANSIT_MOUNT:-transit}"
      SECUREAPPROVE_VAULT_SIGNING_KEY: "${SECUREAPPROVE_VAULT_SIGNING_KEY:-secureapprove-proof-signing}"
      SECUREAPPROVE_VAULT_ENCRYPTION_KEY: "${SECUREAPPROVE_VAULT_ENCRYPTION_KEY:-secureapprove-proof-evidence}"
      SECUREAPPROVE_PROOF_ARCHIVE_ENABLED: "${SECUREAPPROVE_PROOF_ARCHIVE_ENABLED:-False}"
      SECUREAPPROVE_PROOF_ARCHIVE_BUCKET: "${SECUREAPPROVE_PROOF_ARCHIVE_BUCKET:-}"
      SECUREAPPROVE_PROOF_ARCHIVE_RETENTION_DAYS: "${SECUREAPPROVE_PROOF_ARCHIVE_RETENTION_DAYS:-3650}"
      SECUREAPPROVE_PROOF_ARCHIVE_ENDPOINT_URL: "${SECUREAPPROVE_PROOF_ARCHIVE_ENDPOINT_URL:-http://minio:9000}"
      SECUREAPPROVE_PROOF_ARCHIVE_REGION: "${SECUREAPPROVE_PROOF_ARCHIVE_REGION:-us-east-1}"
      SECUREAPPROVE_PROOF_ARCHIVE_ADDRESSING_STYLE: "${SECUREAPPROVE_PROOF_ARCHIVE_ADDRESSING_STYLE:-path}"
      AWS_SHARED_CREDENTIALS_FILE: "/run/secrets/archive-credentials"
      AWS_REGION: "${AWS_REGION:-us-east-1}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      AWS_SESSION_TOKEN: "${AWS_SESSION_TOKEN:-}"
      
      # Email (configure for production)
      EMAIL_HOST: "smtp.gmail.com"
      EMAIL_PORT: "587"
      EMAIL_USE_TLS: "True"
      EMAIL_HOST_USER: "${EMAIL_HOST_USER:-}"
      EMAIL_HOST_PASSWORD: "${EMAIL_HOST_PASSWORD:-}"
      DEFAULT_FROM_EMAIL: "noreply@secureapprove.com"
      
      # Billing (configure for production)
      MERCADOPAGO_ACCESS_TOKEN: "${MERCADOPAGO_ACCESS_TOKEN:-}"
      MERCADOPAGO_WEBHOOK_URL: "https://api.secureapprove.com/api/billing/webhooks/mercadopago/"

      # Optional one-time bootstrap. Leave unset in normal production operation.
      SECUREAPPROVE_BOOTSTRAP_ADMIN_EMAIL: "${SECUREAPPROVE_BOOTSTRAP_ADMIN_EMAIL:-}"
      SECUREAPPROVE_BOOTSTRAP_ADMIN_PASSWORD: "${SECUREAPPROVE_BOOTSTRAP_ADMIN_PASSWORD:-}"
      SECUREAPPROVE_BOOTSTRAP_PRIMARY_EMAIL: "${SECUREAPPROVE_BOOTSTRAP_PRIMARY_EMAIL:-}"
    
    volumes:
      - ./secureapprove_django/media:/app/media
      - ./logs:/app/logs
      - proof_app_secrets:/run/secrets:ro
    networks:
      - internal
      - secureapprove_proxy
      - proof_vault_client
      - proof_archive
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.secureapprove-web.rule=Host(`secureapprove.com`) || Host(`www.secureapprove.com`)"
      - "traefik.http.routers.secureapprove-web.entrypoints=websecure"
      - "traefik.http.routers.secureapprove-web.tls=true"
      - "traefik.http.services.secureapprove-web.loadbalancer.server.port=8005"
      - "traefik.docker.network=secureapprove_proxy"

  # Celery Worker
  celery:
    build: 
      context: ./secureapprove_django
      dockerfile: Dockerfile
    container_name: secureapprove_celery
    command: celery -A config worker -l info
    restart: unless-stopped
    environment:
      # Database
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: secureapprove
      DB_USER: postgres
      DB_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      
      # Redis
      REDIS_URL: redis://redis:6379/1
      
      # Django
      DEBUG: "False"
      SECRET_KEY: "${SECRET_KEY:?SECRET_KEY is required}"
      SECUREAPPROVE_RUN_INITIALIZATION: "False"
      ALLOWED_HOSTS: "localhost,127.0.0.1,secureapprove.com,www.secureapprove.com,api.secureapprove.com"
      
      # Security
      WEBAUTHN_RP_NAME: "SecureApprove"
      WEBAUTHN_RP_ID: "secureapprove.com"
      WEBAUTHN_ORIGIN: "https://secureapprove.com"
      SECUREAPPROVE_PROOF_ENABLED: "${SECUREAPPROVE_PROOF_ENABLED:-False}"
      SECUREAPPROVE_PROOF_MARKETING_ENABLED: "${SECUREAPPROVE_PROOF_MARKETING_ENABLED:-False}"
      SECUREAPPROVE_PROOF_SIGNER: "${SECUREAPPROVE_PROOF_SIGNER:-aws_kms}"
      SECUREAPPROVE_PROOF_ENCRYPTION_BACKEND: "${SECUREAPPROVE_PROOF_ENCRYPTION_BACKEND:-aws_kms}"
      SECUREAPPROVE_PROOF_SIGNING_KEY_ARN: "${SECUREAPPROVE_PROOF_SIGNING_KEY_ARN:-}"
      SECUREAPPROVE_PROOF_SIGNING_KID: "${SECUREAPPROVE_PROOF_SIGNING_KID:-}"
      SECUREAPPROVE_PROOF_ENCRYPTION_KEY_ARN: "${SECUREAPPROVE_PROOF_ENCRYPTION_KEY_ARN:-}"
      SECUREAPPROVE_VAULT_ADDR: "${SECUREAPPROVE_VAULT_ADDR:-http://vault_proxy:8100}"
      SECUREAPPROVE_VAULT_TIMEOUT_SECONDS: "${SECUREAPPROVE_VAULT_TIMEOUT_SECONDS:-5}"
      SECUREAPPROVE_VAULT_TRANSIT_MOUNT: "${SECUREAPPROVE_VAULT_TRANSIT_MOUNT:-transit}"
      SECUREAPPROVE_VAULT_SIGNING_KEY: "${SECUREAPPROVE_VAULT_SIGNING_KEY:-secureapprove-proof-signing}"
      SECUREAPPROVE_VAULT_ENCRYPTION_KEY: "${SECUREAPPROVE_VAULT_ENCRYPTION_KEY:-secureapprove-proof-evidence}"
      SECUREAPPROVE_PROOF_ARCHIVE_ENABLED: "${SECUREAPPROVE_PROOF_ARCHIVE_ENABLED:-False}"
      SECUREAPPROVE_PROOF_ARCHIVE_BUCKET: "${SECUREAPPROVE_PROOF_ARCHIVE_BUCKET:-}"
      SECUREAPPROVE_PROOF_ARCHIVE_RETENTION_DAYS: "${SECUREAPPROVE_PROOF_ARCHIVE_RETENTION_DAYS:-3650}"
      SECUREAPPROVE_PROOF_ARCHIVE_ENDPOINT_URL: "${SECUREAPPROVE_PROOF_ARCHIVE_ENDPOINT_URL:-http://minio:9000}"
      SECUREAPPROVE_PROOF_ARCHIVE_REGION: "${SECUREAPPROVE_PROOF_ARCHIVE_REGION:-us-east-1}"
      SECUREAPPROVE_PROOF_ARCHIVE_ADDRESSING_STYLE: "${SECUREAPPROVE_PROOF_ARCHIVE_ADDRESSING_STYLE:-path}"
      AWS_SHARED_CREDENTIALS_FILE: "/run/secrets/archive-credentials"
      AWS_REGION: "${AWS_REGION:-us-east-1}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      AWS_SESSION_TOKEN: "${AWS_SESSION_TOKEN:-}"
      
      # Email
      EMAIL_HOST: "smtp.gmail.com"
      EMAIL_PORT: "587"
      EMAIL_USE_TLS: "True"
      EMAIL_HOST_USER: "${EMAIL_HOST_USER:-}"
      EMAIL_HOST_PASSWORD: "${EMAIL_HOST_PASSWORD:-}"
      DEFAULT_FROM_EMAIL: "noreply@secureapprove.com"
      
      # Billing
      MERCADOPAGO_ACCESS_TOKEN: "${MERCADOPAGO_ACCESS_TOKEN:-}"
      MERCADOPAGO_WEBHOOK_URL: "https://api.secureapprove.com/api/billing/webhooks/mercadopago/"
    
    volumes:
      - ./secureapprove_django/media:/app/media
      - ./logs:/app/logs
      - proof_app_secrets:/run/secrets:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - internal
      - proof_archive

  celery_beat:
    extends:
      service: celery
    container_name: secureapprove_celery_beat
    command: celery -A config beat -l info --schedule=/tmp/celerybeat-schedule
    healthcheck:
      disable: true

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  vault_data:
    driver: local
  vault_tls:
    driver: local
  vault_auth:
    driver: local
  minio_data:
    driver: local
  minio_root_secrets:
    driver: local
  proof_app_secrets:
    driver: local

networks:
  # Red interna para comunicación entre servicios
  internal:
    name: secureapprove_internal
    driver: bridge

  proof_vault_backend:
    name: secureapprove_proof_vault_backend
    driver: bridge
    internal: true

  proof_vault_client:
    name: secureapprove_proof_vault_client
    driver: bridge
    internal: true

  proof_archive:
    name: secureapprove_proof_archive
    driver: bridge
    internal: true
  
  # Red externa de Traefik (debe existir previamente)
  secureapprove_proxy:
    external: true
