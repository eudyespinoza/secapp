<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SecureApprove Embedded Approval</title>
  <style>
    :root {
      --bg: #f5fbf6;
      --card: #ffffff;
      --line: #d0e2d4;
      --text: #11261a;
      --muted: #4d6354;
      --ok: #0d7f47;
      --warn: #a36a00;
      --err: #a0162f;
      --brand: #0b7b49;
      --radius: 14px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background:
        radial-gradient(700px 200px at 100% 0, #e9f6eb, transparent 60%),
        radial-gradient(500px 160px at 0 100%, #edf9ef, transparent 60%),
        var(--bg);
      font-family: "Segoe UI", "Trebuchet MS", sans-serif;
      color: var(--text);
      min-height: 100vh;
      padding: 14px;
      display: grid;
      place-items: center;
    }

    .card {
      width: min(100%, 560px);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: 0 10px 28px rgba(14, 49, 27, 0.12);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 12px;
      color: var(--brand);
      font-weight: 700;
    }

    .brand svg { width: 24px; height: 24px; }

    h1 {
      margin: 0;
      font-size: 1.08rem;
      letter-spacing: 0.02em;
    }

    .sub {
      margin: 7px 0 14px;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.45;
    }

    .pill {
      display: inline-block;
      border: 1px solid #c9dccf;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 0.78rem;
      color: #2a4c38;
      margin-right: 6px;
      margin-bottom: 8px;
      background: #f3faf5;
    }

    .transaction {
      margin: 12px 0;
      border: 1px solid #d4e3d7;
      border-radius: 10px;
      background: #f8fcf9;
      padding: 10px 12px;
    }

    .transaction-row {
      display: grid;
      grid-template-columns: 110px minmax(0, 1fr);
      gap: 10px;
      padding: 5px 0;
      font-size: 0.82rem;
    }

    .transaction-label { color: var(--muted); }
    .transaction-value { font-weight: 600; overflow-wrap: anywhere; }
    .transaction-hash { font-family: Consolas, "Courier New", monospace; font-size: 0.74rem; }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 6px;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 10px 13px;
      font-size: 0.92rem;
      cursor: pointer;
      font-weight: 600;
    }

    .primary {
      background: linear-gradient(135deg, var(--brand), #0f9257);
      color: white;
    }

    .secondary {
      border: 1px solid #c9dccf;
      background: #f1f8f3;
      color: #1d452f;
    }

    .status {
      margin-top: 12px;
      border: 1px solid #d4e3d7;
      border-radius: 10px;
      min-height: 130px;
      padding: 10px;
      background: #f8fcf9;
      font-family: Consolas, "Courier New", monospace;
      font-size: 0.8rem;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .ok { color: var(--ok); }
    .warn { color: var(--warn); }
    .err { color: var(--err); }
  </style>
</head>
<body>
  <section class="card">
    <div class="brand" aria-label="SecureApprove">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 3 20 6.5v5.3c0 4.7-3.1 7.7-8 9.2-4.9-1.5-8-4.5-8-9.2V6.5L12 3Z" stroke="currentColor" stroke-width="1.8"/>
        <path d="m8.2 12 2.4 2.4 5.3-5.3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>SecureApprove</span>
    </div>
    <h1>SecureApprove Biometric Approval</h1>
    <p class="sub">
      Verifica los datos y confirma con la passkey, biometría o PIN seguro de tu dispositivo.
    </p>

    <div>
      <span class="pill" id="modeTag">Modo seguro: token efimero</span>
      <span class="pill" id="decisionTag">Decision: -</span>
    </div>

    <div class="transaction" aria-label="Detalle de la transacción">
      <div class="transaction-row"><span class="transaction-label">Organización</span><span class="transaction-value" id="tenantValue">-</span></div>
      <div class="transaction-row"><span class="transaction-label">Usuario</span><span class="transaction-value" id="subjectValue">-</span></div>
      <div class="transaction-row"><span class="transaction-label">Documento</span><span class="transaction-value" id="documentValue">-</span></div>
      <div class="transaction-row"><span class="transaction-label">Versión</span><span class="transaction-value" id="versionValue">-</span></div>
      <div class="transaction-row"><span class="transaction-label">SHA-256</span><span class="transaction-value transaction-hash" id="hashValue">-</span></div>
      <div class="transaction-row"><span class="transaction-label">Referencia</span><span class="transaction-value" id="referenceValue">-</span></div>
    </div>

    <div class="actions">
      <button type="button" id="btnConfirm" class="primary" disabled>Confirmar con biometria</button>
      <button type="button" id="btnCancel" class="secondary">Cancelar</button>
    </div>

    <div id="status" class="status">Esperando inicializacion segura...</div>
  </section>

  <script>
    const state = {
      initialized: false,
      parentOrigin: null,
      nonce: null,
      approvalToken: null,
      webauthnOptions: null,
      transaction: null,
    };

    const statusEl = document.getElementById("status");
    const confirmBtn = document.getElementById("btnConfirm");
    const decisionTag = document.getElementById("decisionTag");
    const tenantValue = document.getElementById("tenantValue");
    const subjectValue = document.getElementById("subjectValue");
    const documentValue = document.getElementById("documentValue");
    const versionValue = document.getElementById("versionValue");
    const hashValue = document.getElementById("hashValue");
    const referenceValue = document.getElementById("referenceValue");

    function setStatus(msg, type = "") {
      statusEl.className = "status";
      if (type) statusEl.classList.add(type);
      statusEl.textContent = msg;
    }

    function getParam(name) {
      const params = new URLSearchParams(window.location.search);
      return params.get(name);
    }

    function toArrayBuffer(base64Like) {
      const normalized = base64Like.replace(/-/g, "+").replace(/_/g, "/");
      const padLen = (4 - (normalized.length % 4)) % 4;
      const padded = normalized + "=".repeat(padLen);
      const binary = atob(padded);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i += 1) {
        bytes[i] = binary.charCodeAt(i);
      }
      return bytes.buffer;
    }

    function toBase64url(buffer) {
      const bytes = new Uint8Array(buffer);
      let binary = "";
      for (let i = 0; i < bytes.byteLength; i += 1) {
        binary += String.fromCharCode(bytes[i]);
      }
      return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/g, "");
    }

    function toPublicKeyOptions(serverOptions) {
      const publicKey = { ...serverOptions };
      publicKey.challenge = toArrayBuffer(serverOptions.challenge);

      if (Array.isArray(serverOptions.allowCredentials)) {
        publicKey.allowCredentials = serverOptions.allowCredentials.map((cred) => ({
          ...cred,
          id: toArrayBuffer(cred.id),
        }));
      }

      return publicKey;
    }

    function serializeAssertion(assertion) {
      return {
        id: assertion.id,
        rawId: toBase64url(assertion.rawId),
        type: assertion.type,
        response: {
          clientDataJSON: toBase64url(assertion.response.clientDataJSON),
          authenticatorData: toBase64url(assertion.response.authenticatorData),
          signature: toBase64url(assertion.response.signature),
          userHandle: assertion.response.userHandle
            ? toBase64url(assertion.response.userHandle)
            : null,
        },
      };
    }

    function notifyParent(type, payload = {}) {
      if (!state.parentOrigin || !window.parent) return;
      window.parent.postMessage({
        source: "secureapprove-iframe",
        type,
        nonce: state.nonce,
        payload,
      }, state.parentOrigin);
    }

    function renderTransaction(transaction) {
      const approved = transaction.decision === "approve";
      const documentData = transaction.document || {};
      const context = transaction.context || {};
      const approvalContext = context.approval || {};
      const tenant = transaction.tenant || context.tenant || {};
      const subject = transaction.subject || context.subject_user || {};

      decisionTag.textContent = "Decisión: " + (approved ? "aceptar" : "rechazar");
      confirmBtn.textContent = approved ? "Aceptar con passkey" : "Rechazar con passkey";
      tenantValue.textContent = tenant.name || tenant.key || "-";
      subjectValue.textContent = subject.email || subject.name || "-";
      documentValue.textContent = documentData.type || "-";
      versionValue.textContent = documentData.version || "-";
      hashValue.textContent = documentData.sha256 || "-";
      referenceValue.textContent = approvalContext.reference_id || "-";
    }

    async function apiConfirmApproval(payload) {
      const response = await fetch("/api/approvals/terms/confirm/", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "omit",
        body: JSON.stringify(payload),
      });

      const text = await response.text();
      let data = {};
      try { data = text ? JSON.parse(text) : {}; } catch { data = { raw: text }; }

      if (!response.ok) {
        throw new Error(data.error || data.detail || `HTTP ${response.status}`);
      }

      return data;
    }

    async function runBiometricConfirmation() {
      if (!state.initialized) {
        throw new Error("Widget no inicializado");
      }

      if (!window.PublicKeyCredential || !navigator.credentials) {
        throw new Error("WebAuthn no soportado en este dispositivo/navegador");
      }

      setStatus("[1/3] Solicitando biometria del dispositivo...", "warn");
      const assertion = await navigator.credentials.get({
        publicKey: toPublicKeyOptions(state.webauthnOptions),
      });

      if (!assertion) {
        throw new Error("Autenticacion biometrica cancelada");
      }

      setStatus("[2/3] Enviando confirmacion firmada a SecureApprove...", "warn");
      const confirmPayload = {
        approval_token: state.approvalToken,
        webauthn_response: serializeAssertion(assertion),
      };

      const confirmResult = await apiConfirmApproval(confirmPayload);

      setStatus("[3/3] Aprobacion confirmada con auditoria:\n" + JSON.stringify(confirmResult, null, 2), "ok");
      notifyParent("SECUREAPPROVE_RESULT", {
        success: true,
        transactionId: state.transaction.id,
        status: confirmResult.status,
        approved: confirmResult.approved,
      });
    }

    function bootstrapFromMessage(event) {
      if (!state.parentOrigin || event.origin !== state.parentOrigin || event.source !== window.parent) return;
      if (!event.data || event.data.source !== "secureapprove-loader" || event.data.type !== "SECUREAPPROVE_INIT") return;

      const payload = event.data.payload || {};
      if (event.data.nonce !== state.nonce) {
        setStatus("Nonce invalido: inicializacion rechazada", "err");
        notifyParent("SECUREAPPROVE_ERROR", { error: "invalid_nonce" });
        return;
      }

      const approvalToken = payload.approvalToken;
      const webauthnOptions = payload.webauthnOptions;
      const transaction = payload.transaction;

      if (!approvalToken || !webauthnOptions || !transaction) {
        setStatus("INIT incompleto: faltan datos de la transacción", "err");
        notifyParent("SECUREAPPROVE_ERROR", { error: "invalid_init_payload" });
        return;
      }

      if (!transaction.id || transaction.parentOrigin !== state.parentOrigin ||
          !["approve", "reject"].includes(transaction.decision)) {
        setStatus("La transacción no pertenece a este sitio", "err");
        notifyParent("SECUREAPPROVE_ERROR", { error: "transaction_origin_mismatch" });
        return;
      }

      state.approvalToken = approvalToken;
      state.webauthnOptions = webauthnOptions;
      state.transaction = transaction;
      state.initialized = true;

      renderTransaction(transaction);
      confirmBtn.disabled = false;

      setStatus("Widget inicializado de forma segura.\nToken efimero cargado.\nListo para biometria.", "ok");
      notifyParent("SECUREAPPROVE_READY_ACK", {
        mode: "ephemeral_token",
        transactionId: transaction.id,
        decision: transaction.decision,
      });
    }

    function initSecurityContext() {
      const parentOrigin = getParam("parent_origin");
      const nonce = getParam("nonce");

      if (!parentOrigin || !nonce) {
        setStatus("Falta parent_origin o nonce en query params", "err");
        return false;
      }

      try {
        state.parentOrigin = new URL(parentOrigin).origin;
      } catch {
        setStatus("parent_origin inválido", "err");
        return false;
      }
      state.nonce = nonce;

      return true;
    }

    confirmBtn.addEventListener("click", async () => {
      try {
        await runBiometricConfirmation();
      } catch (error) {
        setStatus("Error en confirmacion biometrica:\n" + error.message, "err");
        notifyParent("SECUREAPPROVE_ERROR", {
          error: "confirm_failed",
          message: error.message,
          transactionId: state.transaction ? state.transaction.id : null,
        });
      }
    });

    document.getElementById("btnCancel").addEventListener("click", () => {
      setStatus("Operacion cancelada por usuario", "warn");
      notifyParent("SECUREAPPROVE_CANCEL", { reason: "user_cancelled" });
    });

    window.addEventListener("message", bootstrapFromMessage);

    if (initSecurityContext()) {
      setStatus("Canal seguro iniciado. Esperando INIT del parent...", "warn");
      notifyParent("SECUREAPPROVE_READY", { mode: "ephemeral_token" });
    }
  </script>
</body>
</html>
